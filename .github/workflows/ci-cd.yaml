# =============================================================================
# Frontend CI/CD - Build, Test, and Deploy
# =============================================================================
# This workflow:
# 1. Builds and tests the Angular application
# 2. Builds Docker image
# 3. Pushes to private registry
# 4. Triggers GitOps deployment via Fundamental.Infra
#
# Triggers:
# - Push to main or develop -> builds and deploys to DEV (there is no production
#   environment; fundamental-prod / sahmbaz.ir was decommissioned 2026-08-05)
# - Push to develop (development)
# - Pull requests (test only)
# =============================================================================

name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  NODE_VERSION: '18'
  REGISTRY: registry.academind.ir
  # Cluster 2's registry on vps-2. A second NAME, not a second A record on REGISTRY: a registry
  # holds state, so round-robin across two whose contents differ for even a few seconds hands
  # out ImagePullBackOff at random.
  REGISTRY2: registry2.academind.ir
  IMAGE_NAME: fundamental-frontend

jobs:
  # ===========================================================================
  # Build and Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, Linux, X64, iran]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Lint
        run: npm run lint --if-present
      
      - name: Determine Sentry Release
        id: sentry-release
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RELEASE="fundamental-admin-angular@${SHORT_SHA}"
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
      
      - name: Build with Sentry Release
        run: |
          # Inject Sentry DSN and Release into environment.prod.ts
          sed -i "s|\${SENTRY_DSN}|${{ secrets.SENTRY_DSN }}|g" src/environments/environment.prod.ts
          sed -i "s|\${SENTRY_RELEASE}|${{ steps.sentry-release.outputs.release }}|g" src/environments/environment.prod.ts
          npm run build -- --configuration production --source-map
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      
      - name: Upload Source Maps to Sentry
        if: github.event_name != 'pull_request' && vars.SENTRY_ENABLED == 'true' && vars.SENTRY_UPLOAD_SOURCEMAPS == 'true'
        run: |
          npx sentry-cli releases new ${{ steps.sentry-release.outputs.release }}
          npx sentry-cli releases files ${{ steps.sentry-release.outputs.release }} upload-sourcemaps ./dist/screener --url-prefix '~/'
          npx sentry-cli releases finalize ${{ steps.sentry-release.outputs.release }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mostafaesmaeili8
          SENTRY_PROJECT: fundamental-admin-angular
          SENTRY_URL: ${{ vars.SENTRY_BASE_URL }}
      
      - name: Test
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless
        continue-on-error: true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/screener
          retention-days: 1

  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build-image:
    name: Build Docker Image
    runs-on: [self-hosted, Linux, X64, iran]
    needs: build-and-test
    if: github.event_name != 'pull_request'
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/screener
      
      - name: Debug - List downloaded files
        run: |
          echo "=== Workspace root ==="
          ls -la
          echo "=== dist directory ==="
          ls -la dist/ || echo "dist/ not found"
          echo "=== dist/screener directory ==="
          ls -la dist/screener/ || echo "dist/screener/ not found"
      
      - name: Determine environment
        id: env
        run: |
          # `dev` is the only environment. fundamental-prod (sahmbaz.ir) was
          # decommissioned on 2026-08-05 — single-trunk development had made it a
          # months-stale mirror of dev, and its values file no longer exists, so a
          # `prod` dispatch would fail in Fundamental.Infra's update-tag workflow.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate version
        id: version
        run: |
          # Get the short SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Get date
          DATE=$(date +%Y%m%d)
          
          VERSION="dev-${DATE}-${SHORT_SHA}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"
      
      - name: Login to Container Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
      
      - name: Build and push
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.environment }}-latest \
            -f ./Dockerfile.prebuilt .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.environment }}-latest
          # Best-effort copy to cluster 2's registry. Deliberately cannot fail the build: vps-2
          # being unreachable must never block a vps-1 deploy, which is the coupling two
          # independent clusters exist to avoid. containerd on vps-2 lists its local registry
          # first and falls through to ${{ env.REGISTRY }}, so a missed copy is a slower pull,
          # not a broken deploy.
          if echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY2 }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin 2>/dev/null; then
            for tag in "${{ steps.version.outputs.version }}" "${{ steps.env.outputs.environment }}-latest"; do
              docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag ${{ env.REGISTRY2 }}/${{ env.IMAGE_NAME }}:$tag
              docker push ${{ env.REGISTRY2 }}/${{ env.IMAGE_NAME }}:$tag                 || echo "::warning::could not mirror ${{ env.IMAGE_NAME }}:$tag to ${{ env.REGISTRY2 }} — cluster 2 will pull from ${{ env.REGISTRY }}"
            done
          else
            echo "::warning::could not log in to ${{ env.REGISTRY2 }} — image not mirrored to cluster 2"
          fi
      
      - name: Create summary
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: \`${{ steps.env.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Trigger GitOps Deployment
  # ===========================================================================
  trigger-deploy:
    name: Trigger GitOps Deploy
    runs-on: [self-hosted, Linux, X64, iran]
    needs: build-image
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Trigger Infra Repo Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: PeSahm/Fundamental.Infra
          event-type: update-image-tag
          client-payload: |
            {
              "component": "frontend",
              "tag": "${{ needs.build-image.outputs.version }}",
              "environment": "${{ needs.build-image.outputs.environment }}"
            }
      
      - name: Summary
        run: |
          echo "## 🚀 GitOps Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.build-image.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ needs.build-image.outputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will automatically sync the deployment." >> $GITHUB_STEP_SUMMARY
